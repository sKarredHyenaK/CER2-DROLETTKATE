{% extends 'patrimonios/base.html' %}
{% block title %}Iniciar Sesión - Fundación Patrimonio Vivo{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4 mt-3">
            <h3 class="text-center mb-4 fw-bold">Iniciar Sesión</h3>

            <!--Aviso de Error-->
            {% if form.errors %}
            <div class="alert alert-danger py-2 small">
                Usuario o contraseña incorrectos.
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="id_username" class="form-label fw-semibold">Nombre de usuario</label>
                    <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username"
                        maxlength="150" required class="form-control" id="id_username">
                </div>

                <div class="mb-3">
                    <label for="id_password" class="form-label fw-semibold">Contraseña</label>
                    <input type="password" name="password" autocomplete="current-password" required class="form-control"
                        id="id_password">
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Ingresar</button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'patrimonios:index' %}" class="text-decoration-none text-muted small">← Volver al
                    inicio</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
